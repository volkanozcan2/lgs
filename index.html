<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>13 Haziran 2027 LGS Geri Sayım</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            overflow: hidden; /* Kaydırma çubuklarını gizle */
        }
        .motto-text {
            transition: opacity 1.5s ease-in-out;
        }

        /* Yıldız Tüneli CSS'i */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0d1117; /* Koyu arka plan */
            perspective: 600px;
            z-index: -1;
        }
        .stars {
            width: 100%;
            height: 100%;
            /* Farklı boyut ve hızlarda yıldız katmanları */
            background-image: 
                radial-gradient(2px 2px at 50% 50%, rgba(255, 255, 255, 0.8), transparent 2px),
                radial-gradient(3px 3px at 50% 50%, rgba(255, 255, 255, 0.6), transparent 3px),
                radial-gradient(4px 4px at 50% 50%, rgba(255, 255, 255, 0.4), transparent 4px);
            background-size: 50px 50px, 150px 150px, 300px 300px;
            animation: move-stars 10s linear infinite;
        }

        @keyframes move-stars {
            from {
                background-position: 0 0, 0 0, 0 0;
                transform: translateZ(-200px);
            }
            to {
                background-position: 500px 500px, 1500px 1500px, 3000px 3000px;
                transform: translateZ(2000px);
            }
        }
    </style>
</head>
<body class="bg-gray-100 text-slate-800 flex items-center justify-center min-h-screen p-4 relative">

    <!-- Yıldız tüneli arka planı -->
    <div class="stars-container">
        <div class="stars"></div>
    </div>

    <!-- Ana içerik konteyneri -->
    <div class="bg-white p-8 sm:p-12 rounded-2xl shadow-2xl text-center max-w-4xl w-full relative z-10">
        <h1 class="text-4xl sm:text-5xl font-bold text-blue-600 mb-8 tracking-wide">
            Büyük Gün Yaklaşıyor...
        </h1>
        <p class="text-base sm:text-lg font-medium text-slate-500 -mt-6 mb-8 tracking-wide">
            LGS &bull; 13 Haziran 2027
        </p>

        <!-- Geri sayım sayacı -->
        <div id="countdown" class="flex justify-center flex-wrap gap-4 sm:gap-6 lg:gap-8 mb-12">
            <div class="flex flex-col items-center bg-gray-200 p-4 rounded-xl shadow-lg w-28 sm:w-32">
                <span id="days" class="text-5xl sm:text-6xl font-bold text-orange-600">0</span>
                <span class="text-xs sm:text-sm mt-2 font-medium uppercase tracking-wider text-slate-600">Gün</span>
            </div>
            <div class="flex flex-col items-center bg-gray-200 p-4 rounded-xl shadow-lg w-28 sm:w-32">
                <span id="hours" class="text-5xl sm:text-6xl font-bold text-orange-600">0</span>
                <span class="text-xs sm:text-sm mt-2 font-medium uppercase tracking-wider text-slate-600">Saat</span>
            </div>
            <div class="flex flex-col items-center bg-gray-200 p-4 rounded-xl shadow-lg w-28 sm:w-32">
                <span id="minutes" class="text-5xl sm:text-6xl font-bold text-orange-600">0</span>
                <span class="text-xs sm:text-sm mt-2 font-medium uppercase tracking-wider text-slate-600">Dakika</span>
            </div>
            <div class="flex flex-col items-center bg-gray-200 p-4 rounded-xl shadow-lg w-28 sm:w-32">
                <span id="seconds" class="text-5xl sm:text-6xl font-bold text-orange-600">0</span>
                <span class="text-xs sm:text-sm mt-2 font-medium uppercase tracking-wider text-slate-600">Saniye</span>
            </div>
        </div>

        <!-- Motivasyonel sözler -->
        <div id="motto-container" class="min-h-[6rem] flex items-center justify-center p-4">
            <p id="motto-text" class="motto-text text-xl sm:text-2xl italic font-light text-slate-700 opacity-0"></p>
        </div>
    </div>

    <script>
        // Hedef tarihi belirle: 13 Haziran 2027 (LGS)
        const TARGET_DATE = new Date("2027-06-13T00:00:00").getTime();
        const countdownElements = {
            days: document.getElementById('days'),
            hours: document.getElementById('hours'),
            minutes: document.getElementById('minutes'),
            seconds: document.getElementById('seconds')
        };
        const mottoElement = document.getElementById('motto-text');

        // Sözler listesi
        const mottos = [
            "ÇOK ÇALIŞ KAZAN U.G",
            "ÇALIŞIRSAN YAPARSIN E.A",
            "HOCAM AKLIMA GELMEDİKİ Z.Ç",
            "ŞİMDİ YORULUYORSUN AMA O GÜN KENDİNLE GURUR DUYACAKSIN G.N",
            "KENDİNE İNANMAK BAŞARMANIN YARISIDIR Ö.K51",
            "BİSMİLLAHİRRAHMANİRRAHİM D.T 01",
            "ÇALIŞINCA OLUYOR A.Y 28",
            "EŞŞEK GİBİ ÇALIŞ ASLAN GİBİ YAŞA S.B.D 28",
            "GEÇ KALKAN ZARARLA OTURUR M.G",
            "ÇALIŞ ÇÜNKÜ SENİ KİMSE KURTARMIYACAK A.S.M",
            "BAŞARANA KADAR DEVAM ET S.A",
            "ÇALIŞKAN İNSAN DAİMA HEDEFİNE ULAŞIR N.B",
            "BU SAVAŞTA İLK ADIMI SEN ATMALISIN U.H.O 61",
            "TÜRKÇEYİ ÇOK ÇALIŞIRSAN İYİ OLUR Ö.F.M",
            "PAÇAYI GÖRMEDEN DEREYİ SIVAMA Ö.D 06",
            "ÖMER GİBİ ÇOK YAZARSAN YAPARSIN D.T.S",
            "İSTEMEK DEĞİL ÇALIŞMAK KAZANDIRIR T.Y",
            "SEN AKLINA KOYDUĞUN HERŞEYİ BAŞARIRSIN ÇÜNKÜ SENİN İNANILMAZ BİR GÜCÜN VAR E.T",
            "ÇALIŞ... U.A",
            "GÖKTE NE VAR E.Ç 27",
            "HAYALLERİNİN PEŞİNDEN KOŞ D.Ş"
        ];
        let mottoIndex = 0;

        // Geri sayımı güncelleyen fonksiyon
        function updateCountdown() {
            const now = new Date().getTime();
            const distance = TARGET_DATE - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // HTML elementlerini güncelle
            countdownElements.days.innerHTML = days;
            countdownElements.hours.innerHTML = hours;
            countdownElements.minutes.innerHTML = minutes;
            countdownElements.seconds.innerHTML = seconds;

            // Eğer süre dolduysa
            if (distance < 0) {
                clearInterval(countdownInterval);
                document.getElementById("countdown").innerHTML = `<span class="text-4xl font-bold text-orange-600">Zaman Doldu!</span>`;
            }
        }

        // Sözleri 5 saniye arayla değiştiren fonksiyon
        function changeMotto() {
            mottoElement.style.opacity = '0';
            setTimeout(() => {
                mottoElement.textContent = mottos[mottoIndex];
                mottoElement.style.opacity = '1';
                mottoIndex = (mottoIndex + 1) % mottos.length;
            }, 1500); // CSS geçiş süresi kadar bekle
        }

        const countdownInterval = setInterval(updateCountdown, 1000);
        setInterval(changeMotto, 5000);
        changeMotto();
        
    </script>
</body>
</html>
